# ==============================================================================
# GRICC 2.0 — Initial HTTP Bootstrap Configuration
# Domain: griccnexus.com / www.griccnexus.com
# Purpose: Pre-certificate HTTP listener for Let's Encrypt ACME verification.
# IMPORTANT: Use this configuration BEFORE running Certbot to prevent
# "cannot load certificate" failures when SSL certificates do not yet exist.
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name griccnexus.com www.griccnexus.com;

    # Let's Encrypt ACME webroot challenge directory
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Initial bootstrap landing / status response while waiting for TLS issuance
    location / {
        add_header Content-Type text/plain;
        return 200 "GRICC Nexus Cloud Provisioning Node (BLR1) Online. Awaiting TLS Certificate Issuance.\n";
    }
}
